[workspace]
resolver = "2"
members = [
    "crates/hyperfetch-core",
    "crates/hyperfetch-cli",
    "crates/hyperfetch-gui",
]

[workspace.package]
version = "1.9.0"
rust-version = "1.89"
edition = "2021"
authors = ["Aditya Sharma"]
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
