[workspace]
resolver = "2"
members = [
    "crates/hyperfetch-core",
    "crates/hyperfetch-cli",
    "crates/hyperfetch-gui",
]

[workspace.package]
version = "1.1.0"
rust-version = "1.89"
edition = "2021"
authors = ["HyperFetch Contributors"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
