# Builds and runs every test suite on Windows and Linux for each push and pull request (macOS has
# its own workflow, macos.yml). No secrets.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The GUI's window libraries (the tray uses no GTK; the rest are loaded at run time), and bsdtar,
      # which unpacks archives on Linux (the tests of encrypted ones need it).
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libarchive-tools
      - run: cargo build --workspace
      - run: cargo test --workspace --no-fail-fast -- --test-threads=4
      - run: node --test "extension/test/*.test.mjs"
      # install.sh checks releases with the same key as the app's updater.
      - if: runner.os == 'Linux'
        name: install.sh trusts the updater's key
        run: |
          key="$(sed -n 's/^const PUBLIC_KEY: &str = "\(.*\)";/\1/p' crates/hyperfetch-core/src/updater.rs)"
          [ -n "$key" ] && grep -qx "PUBLIC_KEY=$key" install.sh
      - if: runner.os == 'Linux'
        run: shellcheck install.sh build-linux.sh packaging/linux/package.sh packaging/macos/bundle.sh

  # The speed benchmark (crates/hyperfetch-core/src/speedbench.rs): simulated links on loopback, a
  # release build, about a minute of downloads. Fails when a scenario is slower than
  # bench/sim-thresholds.json allows; the table goes in the job's summary either way.
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: speed
      - name: Speed benchmark
        run: cargo test --release -p hyperfetch-core --lib speed_bench -- --ignored --nocapture --test-threads=1
        env:
          ENDO_BENCH_OUT: ${{ github.workspace }}/speed.json
          ENDO_BENCH_SUMMARY: ${{ github.workspace }}/speed.md
          ENDO_BENCH_CHECK: "1"
      - if: always()
        run: cat speed.md >> "$GITHUB_STEP_SUMMARY" || true
      # Experiments on the same runner, for comparison only: never fail the job.
      - name: "Experiment: 2 MiB disk writes"
        continue-on-error: true
        run: |
          cargo test --release -p hyperfetch-core --lib speed_bench -- --ignored --nocapture --test-threads=1
          cat speed-writes.md >> "$GITHUB_STEP_SUMMARY"
        env:
          ENDO_BENCH_ONLY: lan,per_client,lossy
          ENDO_WRITE_BATCH: "2097152"
          ENDO_BENCH_LABEL: 2 MiB disk writes
          ENDO_BENCH_OUT: ${{ github.workspace }}/speed-writes.json
          ENDO_BENCH_SUMMARY: ${{ github.workspace }}/speed-writes.md
      - name: "Experiment: mimalloc"
        continue-on-error: true
        run: |
          cargo test --release -p hyperfetch-core --features bench-mimalloc --lib speed_bench -- --ignored --nocapture --test-threads=1
          cat speed-mimalloc.md >> "$GITHUB_STEP_SUMMARY"
        env:
          ENDO_BENCH_LABEL: mimalloc
          ENDO_BENCH_OUT: ${{ github.workspace }}/speed-mimalloc.json
          ENDO_BENCH_SUMMARY: ${{ github.workspace }}/speed-mimalloc.md
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: speed
          path: speed*.json
          if-no-files-found: ignore
