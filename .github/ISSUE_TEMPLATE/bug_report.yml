name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The app's version (Settings > Updates, or `Endos-Unified-Downloader-CLI --version`).
      placeholder: "1.9.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Linux arm64
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version or distribution
      placeholder: "Windows 11 24H2, macOS 15.1, Ubuntu 24.04..."
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      multiple: true
      options:
        - GUI
        - Command line
        - Browser extension
        - Installer or updater
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: Kind of link
      description: What was being downloaded. Please do not post private links.
      options:
        - Direct file (HTTP/HTTPS)
        - FTP
        - Video or audio site (yt-dlp)
        - HLS or DASH stream
        - File host or cloud share (Google Drive, MEGA, ...)
        - Torrent or magnet
        - Metalink
        - Image gallery
        - Not about a download
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The steps to make it happen again, if you know them.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: |
        The lines around the error from the GUI's log (Settings > Open logs folder) or the CLI's output.
        **Remove secrets before posting:** passwords, tokens, cookies, Authorization headers, signed links (`X-Amz-Signature=`, `token=`, `sig=`) and anything else private. The app hides the ones it knows, not all.
      render: text
