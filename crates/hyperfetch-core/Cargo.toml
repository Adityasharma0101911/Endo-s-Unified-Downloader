[package]
name = "hyperfetch-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "cookies", "socks"] }
blake3 = { version = "1.5", features = ["rayon"] }
sha2 = "0.10"
md-5 = "0.10"
quick-xml = "0.37"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.10"
url = "2.5"
futures-util = "0.3"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
percent-encoding = "2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
criterion = "0.5"

[[bench]]
name = "range_bench"
harness = false
