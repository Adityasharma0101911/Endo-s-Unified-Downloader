[package]
name = "hyperfetch-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "cookies", "socks"] }
blake3 = { version = "1.8", features = ["rayon"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
quick-xml = "0.37"
chacha20 = "0.9"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.10"
url = "2.5"
futures-util = "0.3"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
percent-encoding = "2.3"
ring = "0.17"
# Unpacks the files picked out of a remote ZIP as they arrive (zipdir.rs); already built for png.
flate2 = "1.1"
# Unpacks the zstd chunks of casync/desync chunk stores (casync.rs); pure Rust, MIT.
ruzstd = "0.8"
# Network interfaces with their gateways, on every OS (netif.rs); without the Apple/Android extras.
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
# BitTorrent swarm downloads (p2p.rs): rustls instead of the OS TLS stack, no web UI or HTTP API.
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
# SFTP downloads (sftp.rs): pure-Rust SSH on the aws-lc-rs that rustls already builds; no compression.
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "rsa"] }
russh-sftp = "3.0"
# Usenet over TLS (nntp.rs) and yEnc's CRC-32: crates reqwest and flate2 already build.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
crc32fast = "1"
# The browser's DevTools port, a WebSocket on this computer (webcopy.rs): no TLS, no extras.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
# The speed benchmark's HTTP/2 server (reqwest's HTTP/2 builds it already).
h2 = "0.4"
criterion = "0.5"
http = "1"
tokio = { version = "1.43", features = ["test-util"] }
# Host and user keys of the in-process SSH server in sftp.rs's tests; russh already builds it.
rand = "0.10"

[[bench]]
name = "range_bench"
harness = false
