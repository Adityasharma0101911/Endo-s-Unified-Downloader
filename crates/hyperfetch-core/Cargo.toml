[package]
name = "hyperfetch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "cookies", "socks"] }
memmap2 = "0.9"
blake3 = "1.5"
sha2 = "0.10"
md-5 = "0.10"
quick-xml = "0.37"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bitvec = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.10"
url = "2.5"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
criterion = { version = "0.5", features = ["async_tokio"] }
tokio-test = "0.4"

[[bench]]
name = "range_bench"
harness = false
